<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Vôlei Score</title>
  <meta name="description" content="Volleyball scoreboard">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://esm.sh">
  <link rel="modulepreload" href="https://esm.sh/preact@10.29.2">
  <link rel="modulepreload" href="https://esm.sh/htm@3.1.1">
  <link rel="stylesheet" href="styles.css" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;-webkit-overflow-scrolling:auto;position:fixed;top:0;left:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:700;background:#1a1a2e;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .app{height:100dvh;height:100vh;width:100%;display:flex;flex-direction:column;position:relative;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    .loader{display:flex;gap:8px}
    .loader-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.4);animation:loader-bounce 1.2s ease-in-out infinite both}
    .loader-dot:nth-child(1){animation-delay:0s}
    .loader-dot:nth-child(2){animation-delay:0.2s}
    .loader-dot:nth-child(3){animation-delay:0.4s}
    @keyframes loader-bounce{0%,80%,100%{transform:scale(0.6)}40%{transform:scale(1)}}
    #root:has(.loader){display:flex;align-items:center;justify-content:center;height:100dvh;height:100vh;width:100%}
    .load-error{display:none;flex-direction:column;align-items:center;gap:12px;color:rgba(255,255,255,0.6);font-family:inherit;font-weight:700;font-size:clamp(0.85rem,2vmin,1rem);text-align:center;padding:20px}
    .load-error.visible{display:flex}
    .load-error button{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#fff;padding:8px 18px;font-size:0.9rem;cursor:pointer;font-weight:700}
  </style>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="root"><div class="loader"><span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span></div></div>
  <noscript><div class="load-error visible"><p>JavaScript is required.</p><p>JavaScript é necessário.</p></div></noscript>
  <script>
    setTimeout(function(){
      var root=document.getElementById('root');
      if(root&&root.querySelector('.loader')){
        root.innerHTML='<div class="load-error visible"><p>Failed to load. Check your connection.</p><p>Falha ao carregar. Verifique sua conexão.</p><button onclick="location.reload()">Retry / Tentar</button></div>';
      }
    },12000);
  </script>
</body>
</html>
