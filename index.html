    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1022; }
      #boot-loader { position: fixed; inset: 0; display: grid; place-items: center; color: #fff; font: 600 14px system-ui, sans-serif; opacity: .7; }
      #boot-error { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 600 14px system-ui, sans-serif; background: #0b1022; }
      #boot-error button { margin-top: 12px; border: 0; border-radius: 999px; background: rgba(255,255,255,.15); color: #fff; padding: 8px 14px; }

  <link rel="manifest" href="/voleyball/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
    <div id="boot-loader">Carregando…</div>
    <div id="boot-error">
      <div>
        <div>Falha ao carregar o app.</div>
        <button id="boot-retry" type="button">Tentar novamente</button>
      </div>
    </div>
    <script>
      document.getElementById('boot-retry')?.addEventListener('click', () => location.reload());

      window.__VOLEI_BOOT_TIMER__ = setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          const loader = document.getElementById('boot-loader');
          const error = document.getElementById('boot-error');
          if (loader) loader.style.display = 'none';
          if (error) error.style.display = 'grid';
        }
      }, 12000);
    </script>
  </body>
